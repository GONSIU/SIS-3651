{% load static %}
{# Fuentes, configuracion de Tailwind y estilos propios: lo comparten el dashboard y las paginas publicas. #}
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "background": "#f9f9fc",
                    "surface": "#f9f9fc",
                    "surface-bright": "#f9f9fc",
                    "surface-dim": "#dadadc",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-low": "#f3f3f6",
                    "surface-container": "#eeeef0",
                    "surface-container-high": "#e8e8ea",
                    "surface-container-highest": "#e2e2e5",
                    "on-surface": "#1a1c1e",
                    "on-surface-variant": "#44474d",
                    "outline": "#75777e",
                    "outline-variant": "#c5c6cd",
                    "deep-navy": "#0a192f",
                    "on-primary": "#ffffff",
                    "primary-container": "#0d1c32",
                    "on-primary-container": "#76849f",
                    "signal-orange": "#f47920",
                    "secondary": "#9a4600",
                    "on-secondary": "#ffffff",
                    "secondary-container": "#fe8028",
                    "on-secondary-container": "#612900",
                    "tertiary-container": "#071c36",
                    "on-tertiary-container": "#7285a4",
                    "slate-blue": "#2b4494",
                    "error": "#ba1a1a",
                    "on-error": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-error-container": "#93000a"
                },
                borderRadius: {
                    "sm": "0.125rem",
                    "DEFAULT": "0.25rem",
                    "md": "0.375rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
                },
                spacing: {
                    "base": "8px",
                    "gutter-mobile": "16px",
                    "gutter-desktop": "24px",
                    "margin-mobile": "16px",
                    "margin-desktop": "32px",
                    "container-max": "1440px"
                },
                fontFamily: {
                    "headline": ["Sora", "sans-serif"],
                    "body": ["Inter", "sans-serif"],
                    "label": ["JetBrains Mono", "monospace"]
                },
                fontSize: {
                    "headline-xl": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
                    "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "700" }],
                    "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "700" }],
                    "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                    "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                    "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                    "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                    "label-md": ["14px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }],
                    "label-sm": ["12px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "500" }]
                }
            }
        }
    }
</script>

<link href="{% static 'css/styles.css' %}" rel="stylesheet"/>
