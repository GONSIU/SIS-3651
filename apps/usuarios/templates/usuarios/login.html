{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trans Naser — Consola de Administración</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "background": "#f9f9fc",
                    "surface": "#f9f9fc",
                    "surface-bright": "#f9f9fc",
                    "surface-dim": "#dadadc",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-low": "#f3f3f6",
                    "surface-container": "#eeeef0",
                    "surface-container-high": "#e8e8ea",
                    "surface-container-highest": "#e2e2e5",
                    "on-surface": "#1a1c1e",
                    "on-surface-variant": "#44474d",
                    "outline": "#75777e",
                    "outline-variant": "#c5c6cd",
                    "deep-navy": "#0a192f",
                    "on-primary": "#ffffff",
                    "primary-container": "#0d1c32",
                    "on-primary-container": "#76849f",
                    "signal-orange": "#f47920",
                    "secondary": "#9a4600",
                    "on-secondary": "#ffffff",
                    "secondary-container": "#fe8028",
                    "on-secondary-container": "#612900",
                    "tertiary-container": "#071c36",
                    "on-tertiary-container": "#7285a4",
                    "slate-blue": "#2b4494",
                    "error": "#ba1a1a",
                    "on-error": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-error-container": "#93000a"
                },
                borderRadius: {
                    "sm": "0.125rem",
                    "DEFAULT": "0.25rem",
                    "md": "0.375rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
                },
                spacing: {
                    "base": "8px",
                    "gutter-mobile": "16px",
                    "gutter-desktop": "24px",
                    "margin-mobile": "16px",
                    "margin-desktop": "32px",
                    "container-max": "1440px"
                },
                fontFamily: {
                    "headline": ["Hanken Grotesk", "sans-serif"],
                    "body": ["Inter", "sans-serif"],
                    "label": ["JetBrains Mono", "monospace"]
                },
                fontSize: {
                    "headline-xl": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
                    "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "700" }],
                    "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "700" }],
                    "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                    "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                    "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                    "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                    "label-md": ["14px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }],
                    "label-sm": ["12px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "500" }]
                }
            }
        }
    }
</script>

<link href="{% static 'css/styles.css' %}" rel="stylesheet"/>
</head>
<body class="font-body text-body-md text-on-surface antialiased">

<div id="view-login" class="ambient-bg min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<main class="relative z-10 w-full max-w-md">
<div class="glass-panel rounded-xl overflow-hidden flex flex-col p-8 md:p-10">
<div class="flex flex-col items-center mb-8 text-center">
<div class="w-20 h-20 mb-4 rounded-lg border border-outline-variant bg-surface-container-lowest overflow-hidden shadow-sm flex items-center justify-center p-2">
<img alt="Logotipo Trans Naser" class="w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDLq2AZ7Ev8aWQKPrb794UmDm6ngLB4Ksx-73HVmdlnUwapQ7CN0ZHq0P5xnt3A0tekypgC80tBvsn_jZg1xC0t-cl9NAj31BlaTSRJ99Q1i1aTRRH0PxKE0RrsdmbmIvJhAq3dLFtIG3jHujMGxrKk5Hj73csa630t_yZjE9_3Uakawf-VmxnjZi_3GvsK8syd2vMzyZKRqxWYVGjZQ42YCfswW8AunzRCU4Ngvv0VHFulKCk4wt8mX9UkvQs5bnbh1E"/>
</div>
<h1 class="font-headline text-headline-lg text-deep-navy tracking-tight mb-1">Trans Naser</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Acceso a la Consola de Administración</p>
</div>
<form id="login-form" method="post" class="flex flex-col gap-5">
{% csrf_token %}
{% if form.errors %}<div class="bg-error-container text-on-error-container text-body-sm rounded px-4 py-3 mb-1">Usuario o contraseña incorrectos.</div>{% endif %}
<div class="flex flex-col gap-1.5">
<label class="font-label text-label-md text-on-surface-variant flex items-center gap-2" for="username">
<span class="material-symbols-outlined text-[18px]">person</span>Usuario
</label>
<input class="form-input-custom w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded font-body-md py-3 px-4" id="username" name="username" placeholder="Ingrese su usuario" required type="text"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label text-label-md text-on-surface-variant flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[18px]">lock</span>Contraseña
</label>
<div class="relative">
<input class="form-input-custom w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded font-body-md py-3 px-4 pr-11" id="password" name="password" placeholder="••••••••" required type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-deep-navy transition-colors" type="button" onclick="togglePassword()">
<span class="material-symbols-outlined text-[20px]" id="password-eye">visibility_off</span>
</button>
</div>
</div>
<button class="mt-2 w-full bg-signal-orange hover:bg-secondary text-white font-label text-label-md py-3.5 px-6 rounded transition-colors duration-200 flex items-center justify-center gap-2 shadow-sm" type="submit">
Iniciar Sesión<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="mt-8 pt-6 border-t border-surface-container-highest text-center">
<p class="font-label text-label-sm text-on-surface-variant">Sistema de Gestion Logistica Segura v1.0</p>
</div>
</div>
</main>

</div>

<script>
    function togglePassword() {
        var input = document.getElementById('password');
        var eye = document.getElementById('password-eye');
        if (input.type === 'password') { input.type = 'text'; eye.textContent = 'visibility'; }
        else { input.type = 'password'; eye.textContent = 'visibility_off'; }
    }
</script>
</body>
</html>
